<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>疫情週報管理者審核與編輯入口</title>
  <style>
    :root {
      --ink: #153f32;
      --muted: #5f756c;
      --line: #d7e6dc;
      --paper: #fffdf6;
      --panel: #f7fbf4;
      --green: #164e3d;
      --green-dark: #0f382c;
      --gold: #b88316;
      --blue: #cdebf2;
      --danger: #d9534f;
      font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(245, 198, 79, .18), transparent 34rem),
        linear-gradient(135deg, #f8f3dc 0%, #e4f4f4 45%, #fffdf6 100%);
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 800;
    }

    .primary {
      background: var(--green);
      color: #ffffff;
    }
    .primary:hover {
      background: var(--green-dark);
    }

    .secondary {
      background: #eef5f1;
      color: var(--green-dark);
      border: 1px solid var(--line);
    }
    .secondary:hover {
      background: #dcece4;
    }

    .danger-btn {
      background: #fdf2f2;
      color: var(--danger);
      border: 1px solid #f5c6c6;
    }
    .danger-btn:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .notice-bar {
      background: #fff3cd;
      color: #856404;
      border-bottom: 1px solid #ffeeba;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid rgba(21, 63, 50, .12);
      background: rgba(255, 253, 246, .85);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(22px, 2.5vw, 32px);
      color: var(--green-dark);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 420px;
      min-height: calc(100vh - 120px);
    }

    aside {
      border-right: 1px solid var(--line);
      background: rgba(247, 251, 244, .7);
      padding: 18px;
      overflow-y: auto;
    }

    .preview {
      display: grid;
      grid-template-rows: auto auto 1fr;
      background: #ffffff;
    }

    .subject-box {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #fcfefc;
      display: grid;
      gap: 10px;
    }

    .subject-box label {
      font-weight: 900;
      font-size: 14px;
      color: var(--green-dark);
      display: grid;
      gap: 6px;
    }

    .subject-box input {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      color: var(--green-dark);
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      background: #f7faf8;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      padding: 8px 16px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
    }

    .tab.active {
      background: var(--green);
      color: #ffffff;
      font-weight: 900;
    }

    .frame-wrap {
      height: 100%;
      min-height: 600px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .editor {
      border-left: 1px solid var(--line);
      background: rgba(255, 253, 246, .9);
      padding: 18px;
      overflow-y: auto;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .editor-section {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .editor-section h3 {
      margin: 0;
      font-size: 16px;
      color: var(--green-dark);
      border-bottom: 2px solid var(--line);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field {
      display: grid;
      gap: 4px;
    }

    .field label {
      font-size: 13px;
      font-weight: 900;
      color: var(--green-dark);
    }

    .field input, .field textarea {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .item-card {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-card.active {
      border-color: var(--green);
      background: #eef7f3;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      background: #e2ede7;
      color: var(--green-dark);
    }

    .badge.warn {
      background: #fde8e8;
      color: var(--danger);
    }

    .status-msg {
      font-size: 14px;
      font-weight: 800;
      color: var(--green-dark);
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="notice-bar">
      <span>💡 提示：若頁面出現「Failed to fetch」，請雙擊執行資料夾內的 <code>啟動管理後台.cmd</code> 即可自動開起伺服器並載入！</span>
      <button class="secondary" onclick="window.location.href='http://localhost:8787/admin-portal.html'" style="font-size:12px;padding:4px 8px;">前往 http://localhost:8787</button>
    </div>

    <header>
      <div>
        <h1>疫情週報管理者審核與排版編輯入口</h1>
        <p class="subtitle">可在此自由刪除、修改疫苗與疾病訊息文字、調整 TMS / KM 連結，並一鍵儲存發布至網頁。</p>
      </div>
      <div>
        <button class="primary" id="saveAndApplyBtn" style="font-size:16px;padding:10px 20px;">💾 儲存變更並更新發布網頁</button>
      </div>
    </header>

    <div class="shell">
      <aside>
        <h2 style="font-size:16px;margin:0 0 12px 0;color:var(--green-dark);">疾病新聞清單</h2>
        <div id="itemList"></div>
        <button class="secondary" id="importGenerated" style="width:100%;margin-top:12px;">🔄 重新載入最新 CDC 數據</button>
      </aside>

      <main class="preview">
        <div class="subject-box">
          <label>
            信件與發文主旨
            <input id="subjectInput" type="text" autocomplete="off">
          </label>
          <div style="display:flex;gap:12px;align-items:center;">
            <span class="badge" id="workflowBadge">草稿狀態</span>
            <span class="subtitle" id="issueRange"></span>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active" id="tabWeb" type="button">網頁版即時預覽</button>
          <button class="tab" id="tabEmail" type="button">信件版即時預覽</button>
        </div>

        <div class="frame-wrap">
          <iframe id="previewFrame" src="web-preview.html" title="疫情週報預覽"></iframe>
        </div>
      </main>

      <section class="editor">
        <div class="editor-section" id="itemEditPanel">
          <h3>
            <span>📝 編輯新聞內容</span>
            <button class="danger-btn" id="deleteItemBtn" type="button" style="font-size:13px;padding:4px 8px;">🗑️ 刪除此條新聞/疫苗訊息</button>
          </h3>
          
          <div class="field">
            <label>疾病/主題名稱</label>
            <input id="editDisease" type="text">
          </div>

          <div class="field">
            <label>新聞標題</label>
            <input id="editTitle" type="text">
          </div>

          <div class="field">
            <label>重點摘要</label>
            <textarea id="editSummary"></textarea>
          </div>

          <div class="field">
            <label>主要注意對象</label>
            <input id="editAudience" type="text">
          </div>

          <div class="field">
            <label>防護重點/行動建議 (每行一項)</label>
            <textarea id="editActions" style="min-height:100px;"></textarea>
          </div>

          <div class="field">
            <label>詳細補充內文 (每行一段)</label>
            <textarea id="editDetails" style="min-height:100px;"></textarea>
          </div>

          <h3 style="margin-top:12px;">🔗 資源連結編輯</h3>
          
          <div class="field">
            <label>TMS 學習課程連結 URL</label>
            <input id="editEduUrl" type="text">
          </div>

          <div class="field">
            <label>KM 管制手冊連結 URL</label>
            <input id="editKmUrl" type="text">
          </div>

          <div class="field">
            <label>疾管署 CDC 原始新聞稿 URL</label>
            <input id="editCdcUrl" type="text">
          </div>

          <div class="status-msg" id="statusMsg"></div>
          <button class="primary" id="saveItemBtn" type="button">確定修改並預覽</button>
        </div>
      </section>
    </div>
  </div>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:8787' : '';
    let reportData = null;
    let selectedItemId = null;

    async function api(path, options = {}) {
      try {
        const res = await fetch(API_BASE + path, {
          headers: { 'Content-Type': 'application/json' },
          ...options
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        console.error("API error:", err);
        throw err;
      }
    }

    async function init() {
      try {
        const payload = await api('/api/reports');
        if (payload.reports && payload.reports[0]) {
          const fullReport = await api(`/api/reports/${encodeURIComponent(payload.reports[0].id)}`);
          reportData = fullReport.report;
          renderAll();
        }
      } catch (err) {
        document.querySelector('.notice-bar').style.background = '#f8d7da';
        document.querySelector('.notice-bar').style.color = '#721c24';
        document.querySelector('.notice-bar span').innerHTML = `⚠️ 無法連線後台伺服器。請雙擊執行資料夾中的 <b><code>啟動管理後台.cmd</code></b> 或在命令列執行 <code>python scripts/admin_server.py</code>！`;
      }
    }

    function renderAll() {
      if (!reportData) return;
      document.getElementById('subjectInput').value = reportData.subject || '';
      document.getElementById('issueRange').textContent = `涵蓋範圍：${reportData.issue_range?.from || ''} ~ ${reportData.issue_range?.to || ''}`;
      renderItemList();
      if (!selectedItemId) {
        const first = getFirstItem();
        if (first) selectItem(first.id);
      } else {
        renderEditPanel();
      }
    }

    function getFirstItem() {
      for (const s of reportData.sections || []) {
        if (s.items && s.items[0]) return s.items[0];
      }
      return null;
    }

    function renderItemList() {
      const container = document.getElementById('itemList');
      let html = '';
      for (const section of reportData.sections || []) {
        html += `<div style="font-size:12px;font-weight:900;color:var(--muted);margin:10px 0 4px 0;">${section.label || section.id}</div>`;
        for (const item of section.items || []) {
          const active = item.id === selectedItemId ? 'active' : '';
          html += `
            <div class="item-card ${active}" onclick="selectItem('${item.id}')">
              <div>
                <strong style="font-size:14px;color:var(--green-dark);">${escapeHtml(item.disease || item.title)}</strong>
                <div style="font-size:12px;color:var(--muted);">${escapeHtml(item.date || '')}</div>
              </div>
              <span class="badge">編輯</span>
            </div>
          `;
        }
      }
      container.innerHTML = html || '<div class="empty">目前無內容</div>';
    }

    function findItem(id) {
      for (const s of reportData.sections || []) {
        for (const item of s.items || []) {
          if (item.id === id) return item;
        }
      }
      return null;
    }

    function selectItem(id) {
      selectedItemId = id;
      renderItemList();
      renderEditPanel();
    }

    function renderEditPanel() {
      const item = findItem(selectedItemId);
      if (!item) {
        document.getElementById('itemEditPanel').style.display = 'none';
        return;
      }
      document.getElementById('itemEditPanel').style.display = 'grid';
      document.getElementById('editDisease').value = item.disease || '';
      document.getElementById('editTitle').value = item.title || '';
      document.getElementById('editSummary').value = item.summary || '';
      document.getElementById('editAudience').value = item.audience || '';
      document.getElementById('editActions').value = (item.actions || []).join('\n');
      document.getElementById('editDetails').value = (item.details || []).join('\n');

      const links = item.suggested_links || {};
      document.getElementById('editEduUrl').value = links.education?.url || '';
      document.getElementById('editKmUrl').value = links.km?.url || '';
      document.getElementById('editCdcUrl').value = item.source_url || '';
    }

    document.getElementById('saveItemBtn').addEventListener('click', () => {
      const item = findItem(selectedItemId);
      if (!item) return;
      item.disease = document.getElementById('editDisease').value;
      item.title = document.getElementById('editTitle').value;
      item.summary = document.getElementById('editSummary').value;
      item.audience = document.getElementById('editAudience').value;
      item.actions = document.getElementById('editActions').value.split('\n').filter(s => s.trim());
      item.details = document.getElementById('editDetails').value.split('\n').filter(s => s.trim());

      item.suggested_links = item.suggested_links || {};
      if (document.getElementById('editEduUrl').value) {
        item.suggested_links.education = item.suggested_links.education || { name: 'TMS 課程' };
        item.suggested_links.education.url = document.getElementById('editEduUrl').value;
      }
      if (document.getElementById('editKmUrl').value) {
        item.suggested_links.km = item.suggested_links.km || { name: 'KM 手冊' };
        item.suggested_links.km.url = document.getElementById('editKmUrl').value;
      }
      item.source_url = document.getElementById('editCdcUrl').value;

      document.getElementById('statusMsg').textContent = '已更新記憶體中修改。點擊右上方「💾 儲存變更並更新發布網頁」即可正式寫入！';
      renderItemList();
    });

    document.getElementById('deleteItemBtn').addEventListener('click', () => {
      const item = findItem(selectedItemId);
      if (!item) return;
      if (!confirm(`確定要刪除「${item.disease || item.title}」此條新聞訊息嗎？`)) return;

      for (const s of reportData.sections || []) {
        s.items = (s.items || []).filter(i => i.id !== selectedItemId);
      }
      selectedItemId = null;
      renderAll();
      document.getElementById('statusMsg').textContent = '已刪除此項目。點擊右上方「💾 儲存變更並更新發布網頁」即可完成更新！';
    });

    document.getElementById('saveAndApplyBtn').addEventListener('click', async () => {
      if (!reportData) return;
      reportData.subject = document.getElementById('subjectInput').value;
      const statusEl = document.getElementById('statusMsg');
      statusEl.textContent = '正在儲存變更並重新生成全套網頁...';

      try {
        await api(`/api/reports/${encodeURIComponent(reportData.id)}`, {
          method: 'PUT',
          body: JSON.stringify(reportData)
        });
        statusEl.textContent = '✅ 成功儲存變更，網頁與信件已全數更新並推送至 GitHub！';
        document.getElementById('previewFrame').src = 'web-preview.html?v=' + Date.now();
      } catch (err) {
        statusEl.textContent = `❌ 儲存失敗: ${err.message}`;
      }
    });

    document.getElementById('subjectInput').addEventListener('input', (e) => {
      if (reportData) reportData.subject = e.target.value;
    });

    document.getElementById('tabWeb').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('tabEmail').classList.remove('active');
      document.getElementById('previewFrame').src = 'web-preview.html?v=' + Date.now();
    });

    document.getElementById('tabEmail').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('tabWeb').classList.remove('active');
      document.getElementById('previewFrame').src = 'email-preview.html?v=' + Date.now();
    });

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
